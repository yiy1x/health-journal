  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="知己手记">
  <title>知己 · 随身手记</title>

<body>
  <a class="skip" href="#main">跳到内容</a>
  <div id="app"><main id="main"><h1>知己 · 随身手记</h1><p>正在读取此浏览器的加密档案…</p></main></div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="notice" role="status" aria-live="polite"></div>
  <input id="camera" type="file" accept="image/jpeg,image/png" capture="environment" hidden aria-label="拍摄资料">
  <input id="album" type="file" accept="image/jpeg,image/png" multiple hidden aria-label="选择相册照片">
  <input id="files" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt" multiple hidden aria-label="选择资料文件">
  <input id="exchange" type="file" accept=".json" hidden aria-label="导入资料互传文件">
  <input id="sealed" type="file" accept=".hjvault,.json" hidden aria-label="导入加密备份">
  <noscript>此应用需要 JavaScript 与 HTTPS。不要通过聊天内置浏览器保存唯一一份资料。</noscript>
