[project]
name = "health-journal-local"
version = "1.3.1"
description = "A Chinese-first, local-first health journal with traceable records and optional AI."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
health-journal = "health_journal.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["health_journal*"]

[tool.setuptools.package-data]
health_journal = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/phone/*.html", "web/phone/*.css", "web/phone/*.js", "web/phone/*.svg", "web/phone/*.webmanifest", "web/phone/*.txt", "web/phone/_headers"]

[tool.setuptools.data-files]
"share/doc/health-journal-local" = ["README.md", "LICENSE", "DISCLAIMER.md", "PRIVACY.md", "SECURITY.md", "CONTRIBUTING.md", "CHANGELOG.md"]
"share/doc/health-journal-local/docs" = ["docs/*.md"]
"share/doc/health-journal-local/docs/research" = ["docs/research/*.md"]
"share/doc/health-journal-local/docs/screenshots" = ["docs/screenshots/*.jpg", "docs/screenshots/*.png"]
